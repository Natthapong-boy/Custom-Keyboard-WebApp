services:
  # 1. Backend Express API Web Service
  - type: web
    name: keycraft-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false # User enters their MongoDB Atlas connection string in Render Dashboard
      - key: JWT_SECRET
        generateValue: true

  # 2. Frontend React / Vite Static Site
  - type: web
    name: keycraft-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: keycraft-backend
          type: web
          property: host
